<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack | Cadastre Suas Despesas!</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <main>
        <form id="despesasForm" action="formAction.html" method="get">
            <div class="input-box">
                <label for="nome">Despesa:</label>
                <input class="input-field" type="text" id="nome" name="nome" placeholder="Nome da Despesa" required minlength="3" maxlength="100">

                <label for="data">Data da Despesa:</label>
                <input class="input-field" type="date" id="data" name="data" required>

                <label for="valor">Valor da Despesa:</label>
                <div class="valor-container">
                    <span class="prefixo">R$</span>
                    <input class="input-field" type="number" id="valor" name="valor" placeholder="Ex: 19,00" required inputmode="decimal" pattern="^\d+([,\.]\d{1,2})?$">
                </div>
                <label for="descricao">Descrição da Despesa:</label>
                <textarea name="descricao" id="descricao" cols="30" rows="5" placeholder="Ex: Gasto de 19 reais com Delivery" required minlength="10" maxlength="1000"></textarea>
            </div>
            <input type="submit" value="Cadastrar!" class="btn">
        </form>
    </main>
</body>
</html>
